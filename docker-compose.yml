# 只啟動 MySQL，Nuxt 仍在本機跑 npm run dev（開發最順）
# 使用方式：docker compose up -d
# .env 請設 MYSQL_HOST=127.0.0.1  MYSQL_PASSWORD=phr_dev_password

services:
  mysql:
    image: mysql:8.4
    container_name: smart-phr-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-phr_dev_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-FHIR_Appointment_Medicine}
    volumes:
      - smart_phr_mysql_data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  smart_phr_mysql_data:
