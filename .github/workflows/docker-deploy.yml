name: Docker Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize GHCR image name
        id: ghcr
        run: |
          IMAGE="${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ghcr.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-cloud-run:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.ENABLE_GCP_DEPLOY == 'true'
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_SERVICE: ${{ vars.GCP_SERVICE }}
      GCP_SQL_INSTANCE: ${{ vars.GCP_SQL_INSTANCE }}
      GCP_MYSQL_USER: ${{ vars.GCP_MYSQL_USER }}
      GCP_MYSQL_DATABASE: ${{ vars.GCP_MYSQL_DATABASE }}
      GAR_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/smart-phr/app
    steps:
      - name: Normalize GHCR image name
        id: ghcr
        run: |
          IMAGE="${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify Artifact Registry repository
        run: |
          if ! gcloud artifacts repositories describe smart-phr \
            --location="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            echo "Artifact Registry repo 'smart-phr' not found in $GCP_REGION."
            echo "Create it once in Cloud Shell (as project owner):"
            echo "  gcloud artifacts repositories create smart-phr --repository-format=docker --location=$GCP_REGION"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Mirror image to Artifact Registry
        run: |
          GHCR_IMAGE="${{ steps.ghcr.outputs.image }}"
          docker pull "$GHCR_IMAGE"
          docker tag "$GHCR_IMAGE" "$GAR_IMAGE:${{ github.sha }}"
          docker tag "$GHCR_IMAGE" "$GAR_IMAGE:latest"
          docker push "$GAR_IMAGE:${{ github.sha }}"
          docker push "$GAR_IMAGE:latest"

      - name: Deploy to Cloud Run
        run: |
          ENV_VARS="^|^NODE_ENV=production"
          ENV_VARS="${ENV_VARS}|JWT_SECRET=${{ secrets.GCP_JWT_SECRET }}"
          ENV_VARS="${ENV_VARS}|MYSQL_SOCKET_PATH=/cloudsql/${GCP_SQL_INSTANCE}"
          ENV_VARS="${ENV_VARS}|MYSQL_USER=${GCP_MYSQL_USER}"
          ENV_VARS="${ENV_VARS}|MYSQL_PASSWORD=${{ secrets.GCP_MYSQL_PASSWORD }}"
          ENV_VARS="${ENV_VARS}|MYSQL_DATABASE=${GCP_MYSQL_DATABASE}"
          ENV_VARS="${ENV_VARS}|DEMO_FHIR_PATIENT_ID=20830"
          ENV_VARS="${ENV_VARS}|GOOGLE_FHIR_PATIENT_ID=20400"
          ENV_VARS="${ENV_VARS}|FHIR_SERVER_URL=https://hapi.fhir.org/baseR4"
          if [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ]; then
            ENV_VARS="${ENV_VARS}|GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"
          fi
          if [ -n "${{ secrets.GOOGLE_CLIENT_SECRET }}" ]; then
            ENV_VARS="${ENV_VARS}|GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"
          fi
          gcloud run deploy "$GCP_SERVICE" \
            --image "$GAR_IMAGE:${{ github.sha }}" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300 \
            --cpu-boost \
            --add-cloudsql-instances "$GCP_SQL_INSTANCE" \
            --set-env-vars "$ENV_VARS"

      - name: Set APP_URL to service URL
        run: |
          URL="$(gcloud run services describe "$GCP_SERVICE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --format='value(status.url)')"
          gcloud run services update "$GCP_SERVICE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --update-env-vars "APP_URL=${URL}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.ENABLE_VPS_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ vars.VPS_APP_DIR }}
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml ps
